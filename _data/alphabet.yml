# `letters`: the base alphabet of Mizo Orthography 2.0 (no digraphs).
# `legacy`: the traditional (legacy) Mizo alphabet, which counts aw, ch and ng
# as digraph letters.
# `file` is the expected filename (mp3) under assets/audio/alphabets/.
# Add a matching recording and the audio player appears automatically —
# no need to edit index.md. See assets/README.md for the recording guide.
letters:
  - symbol: a
    file: a.mp3
  - symbol: b
    file: b.mp3
  - symbol: c
    file: c.mp3
  - symbol: d
    file: d.mp3
