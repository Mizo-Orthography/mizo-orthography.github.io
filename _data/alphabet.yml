    file: j.mp3
  - symbol: k
    file: k.mp3
  - symbol: l
    file: l.mp3
  - symbol: m
    file: m.mp3
  - symbol: n
    file: n.mp3
  - symbol: o
    file: o.mp3
  - symbol: p
    file: p.mp3
  - symbol: r
    file: r.mp3
  - symbol: s
    file: s.mp3
  - symbol: t
    file: t.mp3
  - symbol: ṭ
    file: t_dot.mp3
  - symbol: u
    file: u.mp3
  - symbol: v
    file: v.mp3
  - symbol: z
    file: z.mp3

